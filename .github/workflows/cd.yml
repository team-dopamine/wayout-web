name: Continuous Deployment

on:
  push:
    branches: ['dev']
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'
        type: choice
        options:
          - info
          - warn
          - debug
      tags:
        description: 'Test scenario tags'
        required: false
        type: boolean
      environment:
        description: 'Environment to run tests against'
        type: environment
        required: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Create .env
        run: echo "${{ secrets.ENVIRONMENT }}" > .env

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Docker image build
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/wayout-web .

      - name: Docker login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Docker Hub push
        run: docker push ${{ secrets.DOCKER_USERNAME }}/wayout-web

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker stop wayout-web || true
            docker rm wayout-web || true
            docker image rm ${{ secrets.DOCKER_USERNAME }}/wayout-web || true
            docker image prune -af --filter "until=168h"
            docker pull ${{ secrets.DOCKER_USERNAME }}/wayout-web
            docker run -d -p 3000:80 --name wayout-web ${{ secrets.DOCKER_USERNAME }}/wayout-web